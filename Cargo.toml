[workspace]
resolver = "3"
members = [
    "crates/ade-core",
    "crates/ade-ui",
    "crates/ade-vm",
    "crates/ade-agent",
    "crates/ade-workspace",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
opencode-codes = { version = "1.18", features = ["async-client", "server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
toml = "0.9"
dirs = "6"
portpicker = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

gpui = "=0.2.2"
gpui-component = "=0.5.1"
gpui-component-assets = "=0.5.1"
